services:
  # PostgreSQL database
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-finance_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-finance_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Application service
  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # Published on localhost only: reachable by a reverse proxy on this host
    # (existing Caddy/nginx) or by the bundled Caddy below, never from outside.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      # Database connection URL for Prisma (host "db" is the service above)
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-finance_db}?schema=public
      # Required: JWT secret for authentication
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # Required: exactly 32 characters (AES-256)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (32 chars) in .env}
      # Optional: AI assistant
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # Optional: SMTP for password recovery emails
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NODE_ENV: production
      PORT: 3000

  # Optional reverse proxy with automatic HTTPS (Let's Encrypt).
  # Enabled with COMPOSE_PROFILES=caddy in .env, for servers where ports
  # 80/443 are free. The site address comes from DOMAIN in .env.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
